<text x="120" y="1035" font-family="Arial" font-size="18" fill="#34465e">Prototype: 3 electrodes (LOW/MID/FULL), pulsed GPIO32, unamplified 4.7Ω shunt to GPIO39. Real: 2 float switches, steady GPIO32, ACS712-30A.</text>
