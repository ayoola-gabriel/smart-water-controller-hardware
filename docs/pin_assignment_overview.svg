<text x="800" y="1010" text-anchor="middle" font-family="Arial" font-size="20" fill="#526176">GPIO32: pulsed 3.3V common for probes; steady 3.3V HIGH for float switches</text>
<text x="800" y="1050" text-anchor="middle" font-family="Arial" font-size="17" fill="#8b3a3a">Overview only — not a fabrication-ready electrical schematic. Check boot-strapping pins and module logic levels.</text>

